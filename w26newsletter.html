<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kappa Rho Newsletter — Winter 2026</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f5f5;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    h1 {
      margin-bottom: 8px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .btn {
      background: black;
      color: white;
      padding: 10px 16px;
      text-decoration: none;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn:hover {
      opacity: 0.85;
    }

    iframe {
      width: 100%;
      height: 90vh;
      border: none;
      background: white;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="top-bar">
      <h1>Winter 2026 Newsletter</h1>
      <a class="btn" href="/A%20Quarter%20of%20Connection.pdf" target="_blank">
        Download PDF
      </a>
    </div>

    <iframe src="/A%20Quarter%20of%20Connection.pdf"></iframe>

  </div>

</html>
